<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mind Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0f11; --grid: rgba(255,255,255,.05); --grid2: rgba(255,255,255,.11); --surface: rgba(22,23,26,.98); --solid: #18191c;
    --node: #18191c; --line: rgba(255,255,255,.08); --hover: rgba(255,255,255,.06);
    --text: #ececef; --muted: #8b8d96; --accent: #f08a4b; --accent2: #f4ae52; --on-accent: #1a0f08;
    --done: #5fd39a; --partial: #8b8d96; --empty: #3a3c42; --link: #f4ae52; --you: #f4ae52;
    --b0: #f08a4b; --b1: #6cb6ff; --b2: #5fd3a6; --b3: #b69cff; --b4: #ff8fa3; --b5: #f2c14e;
    --shadow: 0 16px 44px rgba(0,0,0,.5); --vignette: rgba(0,0,0,.45); --block-shadow: rgba(0,0,0,.3);
    --grain-op: .5; --grain-blend: soft-light;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--text); font: 15px/1.45 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: radial-gradient(ellipse at center, transparent 55%, var(--vignette) 100%); }
  button { font: inherit; color: inherit; }

  #stage { position: fixed; inset: 0; cursor: grab; touch-action: none;
    background-image: radial-gradient(var(--grid2) 1.3px, transparent 1.6px), radial-gradient(var(--grid) 1px, transparent 1.2px);
    background-size: 90px 90px, 18px 18px; }
  #stage.glide { transition: background-position .6s ease, background-size .6s ease; }
  #stage.glide #world { transition: transform .6s ease; }
  #stage.dragging { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  #edges { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
  #edges path { fill: none; stroke-linecap: round; }
  #edges .block { stroke-width: 1.5; stroke-dasharray: none; }
  #edges .link { stroke: var(--link); stroke-width: 2; stroke-dasharray: 6 6; opacity: .9; }

  .node { position: absolute; display: flex; align-items: center; gap: 8px; white-space: nowrap; cursor: pointer;
    user-select: none; transition: box-shadow .15s, transform .15s; max-width: 280px; }
  .node .label { overflow: hidden; text-overflow: ellipsis; }
  .node:hover { transform: translateY(-1px); }
  .node.pop { animation: pop .55s cubic-bezier(.34,1.56,.64,1) backwards; }
  @keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .node::after { content: ""; position: absolute; inset: -2px; border-radius: inherit; pointer-events: none; }
  .node.fresh::after { animation: halo 1.1s ease-out .2s backwards; }
  .node.pulse::after { animation: halo 1.1s ease-out; }
  @keyframes halo { from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); }
    to { box-shadow: 0 0 0 18px transparent; } }
  .node.working::after { animation: think 1.4s ease-in-out infinite; }
  @keyframes think { 0%, 100% { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 70%, transparent); }
    50% { box-shadow: 0 0 0 9px color-mix(in srgb, var(--accent) 15%, transparent); } }
  @media (prefers-reduced-motion: reduce) { .node.pop, .node::after, .send .spin { animation: none !important; } }
  .details { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .details li { display: flex; align-items: flex-start; gap: 10px; padding: 9px 12px; border-radius: 12px; background: var(--hover); }
  .details li::before { content: ""; width: 6px; height: 6px; margin-top: 8px; border-radius: 50%; flex-shrink: 0;
    background: var(--c, var(--accent)); }
  .details li span { flex: 1; }
  .details li.mine { background: none; border: 1.5px dashed color-mix(in srgb, var(--you) 45%, transparent); }
  .details li.mine::before { background: var(--you); }
  .details .rm { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 2px; }
  .actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .meter { height: 8px; border-radius: 999px; background: var(--hover); overflow: hidden; margin: 6px 0 2px; }
  .meter > div { height: 100%; border-radius: 999px; background: var(--accent); transition: width .6s ease; }
  .peek { position: fixed; z-index: 8; width: 260px; padding: 12px 14px; border-radius: 16px; background: var(--surface);
    border: 1px solid var(--line); box-shadow: var(--shadow);
    font-size: 13px; pointer-events: none; animation: peek .14s ease-out; }
  .peek[hidden] { display: none; }
  .peek strong { display: block; font-size: 14px; margin-bottom: 4px; }
  .peek p { margin: 0 0 6px; color: var(--muted); }
  .peek ul { margin: 0; padding-left: 16px; } .peek li { margin: 2px 0; }
  @keyframes peek { from { opacity: 0; transform: translateY(4px); } }
  .ib { position: relative; }
  .dotnew { position: absolute; top: 8px; right: 8px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent);
    border: 2px solid var(--solid); }
  .dotnew[hidden] { display: none; }
  .notes { display: flex; flex-direction: column; gap: 2px; margin: 12px 0 0; }
  .note { display: flex; gap: 12px; align-items: baseline; padding: 10px 12px; border-radius: 10px; }
  .note:hover { background: var(--hover); }
  .note.fresh { background: color-mix(in srgb, var(--accent) 9%, transparent); }
  .note.fresh .note-text::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin: 0 8px 2px 0; }
  .note-text { flex: 1; white-space: pre-wrap; }
  .note-time { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .bubble { max-width: 85%; padding: 9px 14px; border-radius: 18px; white-space: pre-wrap; }
  .bubble.claude { align-self: flex-start; background: var(--hover); border-bottom-left-radius: 6px; }
  .bubble.me { align-self: flex-end; background: var(--accent); color: var(--on-accent); border-bottom-right-radius: 6px; }
  .bubble small { display: block; font-size: 11px; opacity: .7; margin-top: 2px; }
  .chat-box { display: flex; gap: 8px; align-items: flex-end; margin-top: 12px; }
  .chat-box textarea { margin: 0; min-height: 44px; max-height: 160px; flex: 1; font: inherit; border-radius: 18px; }
  .qa { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .qa li { padding: 10px 12px; border-radius: 12px; background: var(--hover); }
  .qa li p { margin: 0 0 8px; font-weight: 500; }
  .qa input { width: 100%; border: 1px solid var(--line); background: var(--solid); color: var(--text); border-radius: 999px;
    padding: 7px 14px; font: inherit; font-size: 14px; outline: none; }
  .qa input:focus { border-color: var(--accent); }
  .qa .mine { display: flex; gap: 8px; align-items: center; font-size: 14px; }
  .qa .mine span:first-child { flex: 1; }
  .asks { display: grid; gap: 10px; margin-top: 12px; }
  .ask { display: grid; gap: 8px; padding: 12px 14px; border-radius: 16px; background: var(--hover); }
  .ask-head { display: flex; gap: 10px; align-items: flex-start; }
  .ask-n { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-size: 12px;
    font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .ask textarea { margin: 0; min-height: 42px; border-radius: 12px; font: inherit; font-size: 14px; }
  .ask .chip { justify-self: start; }
  .node.d1.title { padding: 6px 14px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; border: 0;
    color: var(--c); background: color-mix(in srgb, var(--c) 14%, var(--bg)); border-radius: 8px; box-shadow: none; }
  .node.d1.title .dot { background: var(--c); }
  .composer select { border: 1px solid var(--line); background: var(--solid); color: var(--text); border-radius: 999px; padding: 8px 12px; font: inherit; }
  .ib.ping { color: var(--accent) !important; animation: ping 1.6s ease-in-out infinite; }
  @keyframes ping { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 22%, transparent); } }
  .dock button[hidden] { display: none; }
  .qbadge { position: absolute; top: 3px; right: 1px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px;
    background: var(--accent); color: var(--on-accent); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .qbadge:empty { display: none; }
  .grow { flex: 1; min-width: 0; }
  .xmodal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px;
    background: rgba(0,0,0,.45); animation: fade .15s ease-out; }
  @keyframes fade { from { opacity: 0; } }
  .xbox { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 22px 24px; border-radius: 20px;
    background: var(--solid); border: 1px solid var(--line); box-shadow: var(--shadow); animation: rise-c .2s ease-out; }
  @keyframes rise-c { from { opacity: 0; transform: translateY(10px) scale(.98); } }
  .xbox h2 { margin: 0 0 14px; font-size: 22px; }
  .xq { display: block; margin: 16px 0 8px; font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .xbox textarea { width: 100%; min-height: 84px; resize: vertical; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit; font-size: 14px; outline: none; }
  .xbox textarea:focus { border-color: var(--accent); }
  .xchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .xchip { border: 1px solid var(--line); background: none; color: var(--muted); border-radius: 999px; padding: 5px 11px; font-size: 12.5px; cursor: pointer; }
  .xchip:hover { color: var(--text); border-color: var(--accent); }
  .xsizes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .xsize { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 12px; border-radius: 12px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); text-align: left; }
  .xsize span { font-size: 12px; color: var(--muted); }
  .xsize.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--bg)); }
  .xfoot { display: flex; align-items: center; gap: 8px; margin-top: 22px; flex-wrap: wrap; }
  .xguess { border-color: color-mix(in srgb, var(--accent) 50%, transparent); color: var(--accent); }
  .ideas { display: flex; flex-direction: column; gap: 6px; margin: 14px 0 0; }
  .idea { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 14px; border-radius: 12px;
    background: var(--hover); border: 1px solid transparent; transition: border-color .15s; }
  .idea:hover { border-color: var(--line); }
  .idea .crumb { margin: 0 0 1px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .idea-label { font-size: 14.5px; font-weight: 600; line-height: 1.3; }
  .idea-sum { font-size: 13px; line-height: 1.4; margin-top: 2px; }
  .vote { width: 34px; height: 34px; flex-shrink: 0; display: grid; place-items: center; padding: 0; border-radius: 50%;
    border: 1px solid var(--line); background: var(--solid); cursor: pointer; font-size: 14px; font-weight: 700; line-height: 1; color: var(--muted); }
  .sticky-foot { position: sticky; bottom: -22px; z-index: 2; display: flex; justify-content: flex-end; gap: 8px;
    margin: 14px -24px -22px; padding: 14px 24px 18px; background: var(--solid); border-top: 1px solid var(--line); }
  .vote.yes:hover { background: var(--done); border-color: var(--done); color: var(--bg); }
  .vote.no:hover { background: #ff8fa3; border-color: #ff8fa3; color: var(--bg); }
  .ask-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0 40px 4px 0; }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
  .dots i.done { background: var(--done); } .dots i.on { background: var(--accent); transform: scale(1.25); }
  .card h2.ask-q { font-size: 22px; margin: 10px 0 16px; line-height: 1.3; }
  .opts { display: grid; gap: 8px; }
  .opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 13px 16px; border-radius: 14px;
    border: 1.5px solid var(--line); background: var(--solid); cursor: pointer; font: inherit; font-size: 15px; transition: border-color .12s, background .12s; }
  .opt:hover { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); }
  .opt.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 11%, var(--solid)); }
  .opt kbd { width: 26px; height: 26px; border-radius: 8px; background: var(--hover); display: inline-flex; align-items: center;
    justify-content: center; font: 600 12px/1 inherit; flex-shrink: 0; }
  .opt.sel kbd { background: var(--accent); color: var(--on-accent); }
  .opt .grow { flex: 1; }
  .opt.other { border-style: dashed; color: var(--muted); }
  .opt-input { width: 100%; border: 1.5px solid var(--accent); background: var(--solid); color: var(--text); border-radius: 14px;
    padding: 13px 16px; font: inherit; font-size: 15px; outline: none; }
  .ask-foot { display: flex; align-items: center; gap: 8px; margin-top: 18px; }
  .ask-foot .grow { flex: 1; }
  .ctx { position: fixed; z-index: 30; min-width: 220px; max-width: 280px; padding: 6px; border-radius: 16px;
    background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); animation: peek .12s ease-out; }
  .ctx button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 12px; border-radius: 10px;
    cursor: pointer; font-size: 14px; }
  .ctx button:hover { background: var(--hover); }
  .ctx-title { padding: 6px 12px 4px; font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ctx hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }
  .ctx input { width: 100%; border: 1.5px solid var(--accent); background: var(--solid); color: var(--text); border-radius: 10px;
    padding: 8px 12px; font: inherit; font-size: 14px; outline: none; }
  .node.d1.title, .node.root { scale: var(--inv, 1); transition: box-shadow .15s; }
  .node.d1.title.side-r { transform-origin: left center; } .node.d1.title.side-l { transform-origin: right center; }
  .node.root { transform-origin: center; }
  .node.dragging { cursor: grabbing; transform: scale(1.05); z-index: 2; }
  .node.root { padding: 16px 28px; border-radius: 999px; font-weight: 700; font-size: 19px; color: var(--on-accent);
    background: var(--accent); box-shadow: var(--shadow); max-width: 340px; }
  .node.d1 { padding: 9px 16px; border-radius: 12px; font-weight: 600; font-size: 15px; background: var(--node);
    border: 1px solid color-mix(in srgb, var(--c) 45%, var(--line)); }
  .node.d2 { padding: 7px 12px; border-radius: 10px; font-size: 13.5px; font-weight: 500; background: var(--node);
    border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .node.d2:hover, .node.d1:hover { border-color: color-mix(in srgb, var(--c) 70%, transparent); }
  .node.selected { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 55%, transparent), var(--shadow); }
  .node.linked { box-shadow: 0 0 0 3px color-mix(in srgb, var(--link) 60%, transparent); }
  .node.suggested { border-style: dashed; background: transparent; box-shadow: none; }
  .node.suggested .label { color: var(--muted); }
  .node.local { border: 1px dashed var(--you); }
  .node.skip { opacity: .4; }
  .node.skip .label { text-decoration: line-through; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: var(--empty); }
  .dot.partial { background: transparent; box-shadow: inset 0 0 0 1.5px var(--partial); } .dot.done { background: var(--done); }
  .tag { font-size: 11px; font-weight: 500; padding: 1px 6px; border-radius: 999px; background: var(--hover); color: var(--muted); }
  .tag.you { color: var(--you); } .tag.want { color: var(--done); }
  .toggle { position: absolute; top: 50%; width: 22px; height: 22px; margin-top: -11px; border-radius: 50%;
    border: 1.5px solid color-mix(in srgb, var(--c, var(--accent)) 70%, transparent); background: var(--solid);
    font-size: 11px; font-weight: 700; line-height: 1; padding: 0; cursor: pointer; color: var(--muted); }
  .side-r > .toggle { right: -11px; } .side-l > .toggle { left: -11px; }
  .toggle { opacity: 0; transition: opacity .15s; }
  .node:hover > .toggle, .toggle.closed { opacity: 1; }

  /* bottom dock */
  .legend { position: fixed; left: 20px; bottom: 20px; z-index: 9; display: flex; flex-direction: column; gap: 6px;
    padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line);
    font-size: 12px; color: var(--muted); pointer-events: none; }
  .legend span { display: flex; align-items: center; gap: 8px; }
  .legend .dot { display: inline-block; }
  .lg-idea { width: 14px; height: 8px; border-radius: 3px; border: 1px dashed var(--muted); }
  @media (max-width: 1000px) { .legend { display: none; } }
  .dock { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 10;
    display: flex; align-items: center; gap: 0; padding: 5px 6px; border-radius: 999px; width: max-content;
    background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); max-width: calc(100vw - 24px); }
  .dock-side { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
  .ib.idle { opacity: .4; }
  .dock-side.left { justify-content: flex-end; } .dock-side.right { justify-content: flex-start; }
  .dock button { border: 0; background: none; cursor: pointer; display: grid; place-items: center; position: relative; padding: 0; }
  .ib { width: 42px; height: 42px; flex-shrink: 0; border-radius: 50%; color: var(--muted) !important; transition: background .15s, color .15s; }
  .ib:hover { background: var(--hover) !important; color: var(--text) !important; }
  .ib svg { width: 20px; height: 20px; }
  .ring { width: 24px !important; height: 24px !important; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 4.5; }
  .dock .send { width: 48px; height: 48px; margin: 0 10px; flex-shrink: 0; border-radius: 50%; background: var(--accent); color: var(--on-accent);
    box-shadow: 0 4px 16px color-mix(in srgb, var(--accent) 35%, transparent);
    transition: transform .15s, box-shadow .3s, background .3s; }
  .dock .send:hover { transform: translateY(-1px) scale(1.04); }
  .dock .send:active { transform: scale(.96); }
  .send svg { width: 22px; height: 22px; margin: 2px 2px 0 0; }
  .send .spin { display: none; width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid color-mix(in srgb, var(--on-accent) 25%, transparent);
    border-top-color: var(--on-accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .send.working { cursor: default; }
  .send.working .spin { display: block; }
  .send.working svg, .send.working .badge { display: none; }
  .badge { position: absolute; top: -2px; right: -2px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px;
    background: var(--text); color: var(--bg); font-size: 11.5px; font-weight: 700; display: grid; place-items: center;
    box-shadow: 0 0 0 2px var(--surface); }
  .badge:empty { display: none; }
  .dock-status { position: absolute; left: 50%; bottom: calc(100% + 12px); transform: translateX(-50%); white-space: nowrap;
    padding: 6px 12px; border-radius: 999px; font-size: 12.5px; color: var(--text); background: var(--solid);
    border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); box-shadow: var(--shadow); animation: fade .2s ease-out; }
  .dock-status[hidden] { display: none; }
  .ib.bump { animation: bump .6s cubic-bezier(.3,1.6,.5,1); color: var(--accent) !important; }
  @keyframes bump { 30% { transform: scale(1.25) rotate(-12deg); } 60% { transform: scale(.95) rotate(8deg); } }

  /* info card */
  .card { position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%); width: min(680px, calc(100vw - 32px));
    max-height: min(62vh, 600px); overflow: auto; padding: 22px 24px; border-radius: 24px; background: var(--surface);
    border: 1px solid var(--line); box-shadow: var(--shadow);
    z-index: 9; animation: rise .18s ease-out; }
  .card[hidden] { display: none; }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }
  .card .x { position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; border-radius: 50%; border: 0;
    background: var(--hover); cursor: pointer; color: var(--muted); }
  .crumb { color: var(--muted); font-size: 13px; margin: 0 40px 4px 0; }
  .card h2 { margin: 0 40px 8px 0; font-size: 22px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .card h3 { margin: 20px 0 8px; font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .card p { margin: 0; }
  .muted { color: var(--muted); }
  .lenses { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
  @media (max-width: 560px) { .lenses { grid-template-columns: 1fr; } }
  .lens { background: var(--hover); border-radius: 14px; padding: 12px 14px; }
  .lens b { display: block; font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
  .lens.unknown p { color: var(--muted); font-style: italic; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid color-mix(in srgb, var(--link) 60%, transparent); background: none; border-radius: 999px;
    padding: 4px 12px; cursor: pointer; font-size: 13px; }
  blockquote { margin: 6px 0; padding: 2px 0 2px 12px; border-left: 3px solid var(--accent); color: var(--muted); font-style: italic; }
  .qs { margin: 0; padding-left: 20px; } .qs li { margin: 4px 0; }
  .banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-radius: 14px;
    background: var(--hover); margin: 8px 0; font-size: 14px; }
  .banner .grow { flex: 1; }
  .btn { border: 1px solid var(--line); background: var(--solid); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-size: 14px; }
  .btn:hover { border-color: var(--accent); }
  .btn.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--on-accent); border: 0; font-weight: 600; }
  .composer { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
  .composer input { flex: 1 1 220px; min-width: 0; border: 1px solid var(--line); background: var(--solid); color: var(--text);
    border-radius: 999px; padding: 9px 16px; font: inherit; outline: none; }
  .composer input:focus { border-color: var(--accent); }
  .row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .row .grow { flex: 1; }
  .row button.rm { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 14px; }
  @media (max-width: 560px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat { background: var(--hover); border-radius: 14px; padding: 12px; text-align: center; }
  .stat strong { display: block; font-size: 22px; }
  .stat span { font-size: 12px; color: var(--muted); }
  .big { font-size: 40px; font-weight: 700; line-height: 1; }
  .link-btn { border: 0; background: none; cursor: pointer; padding: 0; text-align: left; }
  .link-btn:hover { color: var(--accent); }
  textarea { width: 100%; min-height: 120px; margin-top: 12px; border: 1px solid var(--line); background: var(--solid); color: var(--text);
    border-radius: 14px; padding: 12px; font: 13px/1.5 ui-monospace, Consolas, monospace; resize: vertical; }
  .toast { position: fixed; right: 20px; bottom: 92px; z-index: 40; display: flex; flex-direction: column; align-items: flex-end;
    gap: 8px; width: min(340px, calc(100vw - 32px)); pointer-events: none; }
  .note-pop { pointer-events: auto; cursor: pointer; max-width: 100%; padding: 10px 14px; border-radius: 12px; font-size: 13.5px; line-height: 1.4;
    background: var(--solid); color: var(--text); border: 1px solid var(--line); box-shadow: var(--shadow);
    animation: note-in .25s cubic-bezier(.2,.9,.3,1.2); transition: opacity .3s, transform .3s; }
  .note-pop.claude { border-left: 3px solid var(--accent); }
  .note-from { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-bottom: 2px; }
  .note-pop.out { opacity: 0; transform: translateX(20px); }
  @keyframes note-in { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
  .empty-state { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); }
</style>
</head>
<body>
<div id="stage"><div id="world"><svg id="edges"></svg><div id="nodes"></div></div></div>

<section class="card" id="card" hidden></section>

<div class="legend" aria-label="Legend">
  <span><i class="dot done"></i>Done</span>
  <span><i class="dot partial"></i>Partly done</span>
  <span><i class="dot empty"></i>Empty</span>
  <span><i class="lg-idea"></i>Claude's idea</span>
</div>
<nav class="dock" aria-label="Mind map controls">
  <div class="dock-side left">
    <button class="ib" id="btn-overview" title="Progress and overview"><svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" style="stroke: var(--hover)"/><circle id="ring-fill" cx="18" cy="18" r="15" style="stroke: var(--done)" stroke-dasharray="0 100" pathLength="100"/></svg></button>
    <button class="ib" id="btn-fit" title="Fit to screen (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button class="ib" id="btn-tidy" title="Tidy up: put dragged nodes back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
    <button class="ib" id="btn-fold" title="Collapse / expand all"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="2"/><path d="M7 12h4M11 6v12M11 6h4M11 18h4"/><circle cx="18" cy="6" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
  </div>
  <button class="send" id="btn-send" title="Send to Claude"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg><i class="spin"></i><span class="badge" id="badge"></span></button>
  <div class="dock-side right">
    <button class="ib" id="btn-section" title="New section"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="ib" id="btn-ideas" title="New ideas: yes or no"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg><span class="qbadge" id="ideas-badge"></span></button>
    <button class="ib" id="btn-ask" title="Claude's questions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"/><circle cx="12" cy="17.2" r=".6" fill="currentColor"/></svg><span class="qbadge" id="ask-badge"></span></button>
    <button class="ib" id="btn-chat" title="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="dotnew" id="chat-dot" hidden></span></button>
  </div>
  <div class="dock-status" id="dock-status" hidden></div>
</nav>
<div class="toast" id="toast"></div>
<div class="peek" id="peek" hidden></div>

<script src="map-data.js"></script>
<script src="viewer.js"></script>
<script src="viewer-ui.js"></script>
<script src="viewer-expand.js"></script>
</body>
</html>
